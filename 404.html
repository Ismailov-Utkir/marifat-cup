<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sahifa topilmadi — Ma'rifat Cup</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@900&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: linear-gradient(135deg, #0d1421 0%, #1a2942 100%);
    color: white; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; text-align: center;
  }
  .wrap { max-width: 500px; }
  h1 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: clamp(80px, 20vw, 160px); font-weight: 900;
    line-height: 0.9; letter-spacing: -0.05em;
    background: linear-gradient(135deg, #14b8a6, #fbbf24);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  h2 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 28px; margin: 12px 0 16px;
  }
  p { color: rgba(255,255,255,0.7); margin-bottom: 28px; font-size: 16px; }
  a {
    display: inline-block; background: #14b8a6; color: white;
    text-decoration: none; padding: 14px 28px; border-radius: 14px;
    font-weight: 700; font-size: 16px;
    box-shadow: 0 4px 0 #0d9488;
  }
  a:hover { transform: translateY(-2px); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>404</h1>
    <h2>Sahifa topilmadi</h2>
    <p>Kechirasiz, siz qidirayotgan sahifa mavjud emas yoki ko'chirilgan.</p>
    <a href="./">🏠 Bosh sahifaga qaytish</a>
  </div>
</body>
</html>
